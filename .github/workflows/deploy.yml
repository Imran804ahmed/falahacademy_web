name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Don't let two deploys upload to the server at the same time
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Verify Static Export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          echo "Files to deploy: $(find out -type f | wc -l)"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp over explicit FTPS: reconnects and retries on its own, and only uploads
      # files that changed (by size/time). Files on the server that are no longer in the
      # build are left alone (no --delete), so nothing on Hostinger is removed by a deploy.
      - name: Deploy to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}       # host/IP only, no "ftp://"
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}  # read by lftp --env-password
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }} # "./" when the FTP account opens in public_html
        run: |
          lftp -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            open --env-password -u \"$FTP_USERNAME\" -p 21 \"$FTP_SERVER\";
            mirror --reverse --verbose --only-newer --parallel=4 \
              --exclude-glob .git* --exclude-glob node_modules/ \
              ./out/ \"$FTP_SERVER_DIR\";
            bye
          "